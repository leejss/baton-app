name: CI checks (disabled)

# CI가 필요해지면 원하는 트리거의 주석을 해제하고 quality.if를 제거합니다.
# on:
#   pull_request:
#     branches: ['main']
#   push:
#     branches: ['main']

# concurrency:
#   cancel_in_progress: true
#   group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  quality:
    name: Format, lint, typecheck, and Expo Doctor
    if: ${{ false }}
    environment: development
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Expo Doctor
        run: npx expo-doctor
