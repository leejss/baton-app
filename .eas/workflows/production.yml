name: Production builds and internal store delivery

on:
  push:
    tags: ['v*.*.*']

jobs:
  validate:
    name: Validate app configuration
    environment: production
    env:
      APP_VARIANT: production
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Validate Expo configuration
        run: npm run validate:app-config

  build_android:
    name: Build Android production app
    needs: [validate]
    type: build
    params:
      platform: android
      profile: production

  build_ios:
    name: Build iOS production app
    needs: [validate]
    type: build
    params:
      platform: ios
      profile: production

  submit_android:
    name: Submit to Google Play internal testing
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  submit_ios:
    name: Submit to App Store Connect and TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
